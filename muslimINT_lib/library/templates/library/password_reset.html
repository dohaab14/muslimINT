{% extends "library/base.html" %}
{% block content %}
<section style="max-width: 500px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
  <h2 style="text-align: center; margin-bottom: 1rem;">🔑 Réinitialiser le mot de passe</h2>
  <p style="text-align: center; color: #666; margin-bottom: 1.5rem;">Entrez votre adresse e-mail et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
  
  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 1rem;">
      <label for="id_email" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Adresse e-mail</label>
      <input type="email" name="email" id="id_email" required
             style="width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1rem;">
    </div>
    <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
      Envoyer le lien de réinitialisation
    </button>
  </form>
  
  <p style="text-align: center; margin-top: 1rem;">
    <a href="{% url 'library:login' %}" style="color: var(--mint-green);">← Retour à la connexion</a>
  </p>
</section>
{% endblock %}
