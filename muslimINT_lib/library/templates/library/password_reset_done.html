{% extends "library/base.html" %}
{% block content %}
<section style="max-width: 500px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;">
  <h2>📧 E-mail envoyé !</h2>
  <p style="color: #666; margin-top: 1rem;">Si un compte existe avec cette adresse, vous recevrez un e-mail avec les instructions pour réinitialiser votre mot de passe.</p>
  <a href="{% url 'library:login' %}" class="btn" style="display: inline-block; margin-top: 1.5rem;">Retour à la connexion</a>
</section>
{% endblock %}
