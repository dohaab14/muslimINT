{% extends "library/base.html" %}
{% block content %}
<div style="max-width: 500px; margin: 5rem auto; text-align: center; background: white; padding: 3rem; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);">
    <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
    <h2 style="color: var(--deep-blue); margin-bottom: 1rem;">Mot de passe modifié !</h2>
    <p style="color: #64748b; margin-bottom: 2rem;">Votre nouveau mot de passe a été enregistré avec succès. Vous pouvez continuer à utiliser Maktaba'Int.</p>
    
    <a href="{% url 'library:profile' %}" class="btn" style="background: var(--mint-green); color: white; text-decoration: none; padding: 0.8rem 2rem; border-radius: 12px; font-weight: 600; display: inline-block;">
        Retour à mon profil
    </a>
</div>
{% endblock %}
