{% extends "library/base.html" %}
{% block content %}
<section class="form-section">
  <h2>Modifier le livre : "{{ book.title }}"</h2>
  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="title">Titre</label>
      <input type="text" name="title" id="title" value="{{ book.title }}" required>
    </div>

    <div class="form-group">
      <label for="author">Auteur</label>
      <input type="text" name="author" id="author" value="{{ book.author }}" required>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea name="description" id="description">{{ book.description }}</textarea>
    </div>

    <div class="form-group">
      <label for="isbn">ISBN</label>
      <input type="text" name="isbn" id="isbn" value="{{ book.isbn }}">
    </div>

    <div class="form-group">
      <label for="total_copies">Nombre de copies</label>
      <input type="number" name="total_copies" id="total_copies" value="{{ book.total_copies }}" min="1">
    </div>

    <div class="form-group">
      <label for="category">Catégorie</label>
      <input type="text" name="category" id="category" value="{{ book.category.name if book.category }}">
    </div>

    <button type="submit" class="btn">Mettre à jour</button>
    <a href="{% url 'library:admin_dashboard' %}" class="btn btn-secondary">Annuler</a>

    <button type="submit" class="btn">Supprimer</button>
    <a href="{% url 'library:admin_delete_book' book.id %}" class="btn btn-secondary">Annuler</a>

</form>
</section>

{{ block.super }}
{% endblock %}
