<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliothèque de MUSLIM'INT Numérique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b-2 border-green-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-green-500 rounded-lg flex items-center justify-center">
            <span class="text-white font-bold text-xl">📚</span>
          </div>
          <h1 class="text-2xl font-bold text-gray-900">Bibliothèque Numérique</h1>
        </div>
        
        <div class="flex items-center space-x-4">
          <div class="flex bg-gray-100 rounded-lg p-1">
            <button id="readerMode" class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-green-500 text-white">
              Lecteur
            </button>
            <button id="adminMode" class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-gray-900">
              Administrateur
            </button>
          </div>
          <div id="userInfo" class="text-sm text-gray-600">
            Mode: <span id="currentMode" class="font-semibold text-green-600">Lecteur</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="relative flex-1 max-w-md">
        <input type="text" id="searchInput" placeholder="Rechercher un livre..." 
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
          <span class="text-gray-400">🔍</span>
        </div>
      </div>
      
      <button id="addBookBtn" class="hidden bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg font-medium transition-colors">
        ➕ Ajouter un livre
      </button>
    </div>
  </div>

  <!-- Books Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
    <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Books will be populated here -->
    </div>
  </main>

  <!-- Book Details Modal -->
  <div id="bookModal" class="hidden fixed inset-0 bg-black bg-opacity-50 modal z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6">
        <div class="flex justify-between items-start mb-4">
          <h2 id="modalTitle" class="text-2xl font-bold text-gray-900"></h2>
          <button id="closeModal" class="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
        </div>
        
        <div class="flex flex-col md:flex-row gap-6">
          <div class="flex-shrink-0">
            <div id="modalCover" class="w-48 h-64 bg-gradient-to-br from-green-400 to-green-600 rounded-lg flex items-center justify-center text-white text-6xl mx-auto md:mx-0">
              📖
            </div>
          </div>
          
          <div class="flex-1">
            <div class="space-y-4">
              <div>
                <h3 class="font-semibold text-gray-700 mb-1">Auteur</h3>
                <p id="modalAuthor" class="text-gray-600"></p>
              </div>
              
              <div>
                <h3 class="font-semibold text-gray-700 mb-1">Résumé</h3>
                <p id="modalSummary" class="text-gray-600 leading-relaxed"></p>
              </div>
              
              <div>
                <h3 class="font-semibold text-gray-700 mb-1">Statut</h3>
                <span id="modalStatus" class="inline-block px-3 py-1 rounded-full text-sm font-medium"></span>
              </div>
            </div>
            
            <div class="mt-6 flex gap-3">
              <button id="borrowBtn" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                📚 Emprunter
              </button>
              <button id="returnBtn" class="hidden bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                📤 Retourner
              </button>
              <button id="editBtn" class="hidden bg-yellow-500 hover:bg-yellow-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                ✏️ Modifier
              </button>
              <button id="deleteBtn" class="hidden bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                🗑️ Supprimer
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Book Modal -->
  <div id="addBookModal" class="hidden fixed inset-0 bg-black bg-opacity-50 modal z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full">
      <div class="p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 id="addBookTitle" class="text-xl font-bold text-gray-900">Ajouter un livre</h2>
          <button id="closeAddModal" class="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
        </div>
        
        <form id="bookForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Titre</label>
            <input type="text" id="bookTitle" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Auteur</label>
            <input type="text" id="bookAuthor" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Résumé</label>
            <textarea id="bookSummary" rows="4" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"></textarea>
          </div>
          
          <div class="flex gap-3 pt-4">
            <button type="submit" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-medium transition-colors">
              Enregistrer
            </button>
            <button type="button" id="cancelAdd" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 rounded-lg font-medium transition-colors">
              Annuler
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script src="js/app.js"></script>
</body>
</html>
