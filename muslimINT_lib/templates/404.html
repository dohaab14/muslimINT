{% load static %}
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page introuvable — MuslimINT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: "Poppins", sans-serif;
    background: #f5f6f7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    color: #1f2937;
  }
  .error-box {
    background: white;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    padding: 3rem 2.5rem;
    max-width: 500px;
  }
  .error-code {
    font-size: 5rem;
    font-weight: 700;
    color: #2CB67D;
    line-height: 1;
  }
  .error-msg {
    font-size: 1.2rem;
    margin: 1rem 0 2rem;
    color: #6b7280;
  }
  .btn-home {
    background: #2CB67D;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1.5rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.3s;
  }
  .btn-home:hover { background: #24a46e; }
</style>
</head>
<body>
  <div class="error-box">
    <div class="error-code">404</div>
    <p class="error-msg">Cette page n'existe pas ou a été déplacée.</p>
    <a href="/" class="btn-home">Retour à l'accueil</a>
  </div>
</body>
</html>
