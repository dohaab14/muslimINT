{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MuslimINT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* TODO : move to static CSS file */
    :root {
      --mint-green: #2CB67D;
      --deep-blue: #0E223F;
      --light-gray: #f5f6f7;
      --text-dark: #1f2937;
    }

    body {
      font-family: "Poppins", "Segoe UI", Arial, sans-serif;
      background-color: var(--light-gray);
      color: var(--text-dark);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: white;
      border-bottom: 3px solid var(--mint-green);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 a {
      text-decoration: none;
      color: var(--deep-blue);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    header h1 a span {
      color: var(--mint-green);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    nav a {
      text-decoration: none;
      color: var(--deep-blue);
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--mint-green);
    }

    main {
      flex: 1;
      max-width: 900px;
      margin: 2rem auto;
      padding: 1.5rem;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
    }

    footer {
      background-color: var(--deep-blue);
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      margin-top: auto;
    }

    .username {
      background: var(--mint-green);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    hr {
      border: none;
      border-bottom: 1px solid #e5e7eb;
      margin-top: 1rem;
    }

    /* Boutons */
    .btn {
      background: var(--mint-green);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #24a46e;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <a href="{% url 'library:book_list' %}">
        MUSLIM<span>INT</span>
      </a>
    </h1>

    <nav>
      {% if user.is_authenticated %}
        <span class="username">Bonjour {{ user.username }}</span>
        <a class="btn" href="{% url 'admin:logout' %}">Se déconnecter</a>
      {% else %}
        <a class="btn" href="{% url 'admin:login' %}">Se connecter</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    © {{ now|date:"Y" }} MuslimINT — Bibliothèque numérique inspirante 🌙
  </footer>
</body>
</html>
